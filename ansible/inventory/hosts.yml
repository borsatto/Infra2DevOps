---
# Static inventory for Flatcar Container Linux nodes provisioned by Terraform (LAN 192.168.1.0/24).
all:
  vars:
    ansible_user: core
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_python_interpreter: /opt/bin/python3
  children:
    lb:
      hosts:
        k8s-lb01: { ansible_host: "192.168.1.100" }
    control_plane_init:
      hosts:
        k8s-cp01: { ansible_host: "192.168.1.101" }
    control_plane_join:
      hosts:
        k8s-cp02: { ansible_host: "192.168.1.102" }
        k8s-cp03: { ansible_host: "192.168.1.103" }
    control_plane:
      children:
        control_plane_init:
        control_plane_join:
    workers:
      hosts:
        k8s-worker01: { ansible_host: "192.168.1.111" }
        k8s-worker02: { ansible_host: "192.168.1.112" }
        k8s-worker03: { ansible_host: "192.168.1.113" }
    k8s_cluster:
      children:
        control_plane:
        workers:
