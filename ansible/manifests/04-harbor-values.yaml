# ============================================================================
# Harbor Enterprise Container Registry & Security Scanner (Helm Values)
# Endpoint Corporativo: https://harbor.corp.devopsclub.io
# ============================================================================
expose:
  type: ingress
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: "corp-wildcard-tls"
  ingress:
    hosts:
      core: harbor.corp.devopsclub.io
    className: nginx
    annotations:
      ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

externalURL: https://harbor.corp.devopsclub.io

persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      storageClass: "proxmox-fast"
      accessMode: ReadWriteOnce
      size: 20Gi
    database:
      storageClass: "proxmox-fast"
      accessMode: ReadWriteOnce
      size: 5Gi
    redis:
      storageClass: "proxmox-fast"
      accessMode: ReadWriteOnce
      size: 2Gi
    trivy:
      storageClass: "proxmox-fast"
      accessMode: ReadWriteOnce
      size: 5Gi

trivy:
  enabled: true

