apiVersion: v1
kind: Namespace
metadata:
  name: dashy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashy-config
  namespace: dashy
data:
  conf.yml: |
    pageInfo:
      title: Infra 2 DevOps — Cloud Native Lab
      description: Portal de Serviços rodando em Kubernetes HA (Flatcar Linux + Proxmox VE no Dell PowerEdge R630)
      navLinks:
        - title: GitHub (megabash)
          path: https://github.com/borsatto/megabash
        - title: Docker Hub (aborsatto/megabash)
          path: https://hub.docker.com/r/aborsatto/megabash
    appConfig:
      theme: one-dark
      layout: auto
      iconSize: large
    sections:
      - name: Plataforma & Engenharia DevOps
        icon: fas fa-cubes
        items:
          - title: ArgoCD GitOps
            description: Entrega Contínua Declarativa (GitOps) — Perímetro Interno (AD/LDAP)
            icon: fas fa-code-branch
            url: https://argocd.corp.devopsclub.io
            target: newtab
          - title: Harbor Container Registry
            description: Enterprise OCI Registry & Vulnerability Scanner (Trivy) — Perímetro Interno (AD/LDAP)
            icon: fas fa-anchor
            url: https://harbor.corp.devopsclub.io
            target: newtab
          - title: BookStack Wiki
            description: Portal de Documentação de Arquitetura, Runbooks e DR (Público + AD/LDAP)
            icon: fas fa-book
            url: https://wiki.devopsclub.io
            target: newtab
          - title: Grafana & Prometheus
            description: Observabilidade Cloud Native (kube-prometheus-stack) — Perímetro Interno (AD/LDAP)
            icon: fas fa-chart-line
            url: https://grafana.corp.devopsclub.io
            target: newtab
          - title: Uptime Kuma
            description: Monitoramento de Disponibilidade dos Endpoints PoC — Perímetro Interno
            icon: fas fa-heartbeat
            url: https://status.corp.devopsclub.io
            target: newtab
      - name: Aplicações & Utilitários Self-Hosted
        icon: fas fa-layer-group
        items:
          - title: BentoPDF Toolkit
            description: Ferramentas PDF Client-Side Stateless (Deployment + HPA) — Perímetro Interno
            icon: fas fa-file-pdf
            url: https://pdf.corp.devopsclub.io
            target: newtab
          - title: Calibre-Web Library
            description: Biblioteca de E-books com Clássicos em Domínio Público (Perímetro Público)
            icon: fas fa-book-open
            url: https://books.devopsclub.io
            target: newtab
      - name: Projetos Autorais & Imagens
        icon: fab fa-docker
        items:
          - title: aborsatto/megabash (Docker Hub)
            description: Container DevOps Toolbox (Fedora 44 + PowerShell 7 + Terraform + Ansible + K8s)
            icon: fab fa-docker
            url: https://hub.docker.com/r/aborsatto/megabash
            target: newtab
          - title: borsatto/megabash (GitHub)
            description: Código-fonte e Dockerfile do container megabash
            icon: fab fa-github
            url: https://github.com/borsatto/megabash
            target: newtab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashy
  namespace: dashy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashy
  template:
    metadata:
      labels:
        app: dashy
    spec:
      containers:
        - name: dashy
          image: harbor.corp.devopsclub.io/devops/dashy:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/user-data/conf.yml
              subPath: conf.yml
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: dashy-config
---
apiVersion: v1
kind: Service
metadata:
  name: dashy
  namespace: dashy
spec:
  selector:
    app: dashy
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashy
  namespace: dashy
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dash.corp.devopsclub.io
      secretName: corp-wildcard-tls
  rules:
    - host: dash.corp.devopsclub.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashy
                port:
                  number: 80
