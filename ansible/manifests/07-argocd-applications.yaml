# ============================================================================
# ArgoCD Declarative GitOps Applications (Single Source of Truth: GitLab)
# Endpoint: https://argocd.corp.devopsclub.io
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@gitlab.vtechlabs.com.br:4222/andre/infra2devops.git
    targetRevision: main
    path: ansible/manifests
    directory:
      include: "01-dashy.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: dashy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
